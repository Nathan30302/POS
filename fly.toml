# NEXORA Shop OS — Fly.io always-on demo
# Deploy: fly apps create nexora-shop-demo && fly volumes create nexora_data --size 1 --region jnb
#         fly secrets set JWT_SECRET=... MOMO_WEBHOOK_SECRET=... CORS_ORIGIN=https://….fly.dev SHOP_PUBLIC_ORIGIN=https://….fly.dev
#         fly deploy

app = "nexora-shop-demo"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  SERVE_SPA = "1"
  DATABASE_URL = "file:/data/nexora.db"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "45s"
  method = "GET"
  path = "/api/health"

[[mounts]]
  source = "nexora_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
